<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Parceria | DripLab</title>
</head>
<body id="parceria">
    <nav id="menu-parceria">
        <a href="./index.html"><img src="../img/icone-home.png" alt="icone de home"></a>
        <a href="./perfil.html"><img src="../img/icone-perfil.png" alt="icone de perfil"></a>
    </nav>

    <h1 class="parceria">Quer se juntar a nós? Entre em contato!</h1>

    <form id="form-parceria" action="/parceria" method="post">
        <div class="campo">
            <input type="text" id="nome" name="nome"
            class="parceria" placeholder=" " required>
            <label for="nome">Nome Completo</label>
        </div>

        <div class="campo">
            <input type="email" id="email" name="email"
            class="parceria" placeholder=" " required>
            <label for="email">E-mail</label>
        </div>

        <div class="campo">
            <input type="tel" id="telefone" name="telefone"
            class="parceria" placeholder=" " required>
            <label for="telefone">Telefone</label>
        </div>

        <div class="campo">
            <textarea id="mensagem" name="mensagem" class="parceria" placeholder=" " required></textarea>
            <label for="mensagem">Mensagem</label>
        </div>

        <button type="submit" class="botao-parceria">
            Enviar
        </button>
    </form>

    <footer>
        <div id="info-parceria">
            <div class="info-pa">
                <h2>FALE CONOSCO</h2> 
                <h3>(21) 1234-5678</h3>
            </div>
            <div class="info-pa">
                <h2>CENTRAL DE ATENDIMENTO</h2> 
                <h3>Segunda a Sexta: 8h às 18h</h3>
            </div>
            <div class="info-pa">
                <h2>NOSSAS REDES SOCIAIS</h2>
                
                <div class="redes">
                    <h3>INSTAGRAM: @driplabswag_</h3>
                    <h3>FACEBOOK: driplabswag01</h3>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
